name: Workflow lint

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.y*ml"
      - "**/action.y*ml"
      - "**/.shellcheckrc"
      - "**/shellcheckrc"
      - ".gitattributes"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.y*ml"
      - "**/action.y*ml"
      - "**/.shellcheckrc"
      - "**/shellcheckrc"
      - ".gitattributes"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
