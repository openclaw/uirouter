name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-workflows:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/lint-workflows.yml

  check:
    name: Node ${{ matrix.node }} check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.23.4
          - 24.22.1
        os:
          - xcode-27
          - windows-latest
        event: ["${{ github.event_name }}"]
        # Qualify both native platforms across the PR and its merge.
        exclude:
          - event: pull_request
            node: 22.23.4
          - event: push
            node: 24.22.1
        include:
          - node: 22.23.4
            os: ubuntu-latest
          - node: 24.22.1
            os: ubuntu-latest
          - node: 26.12.1
            os: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check
